[workspace]
resolver = "2"
members = [
    "crates/miedit-core",
    "crates/miedit-compiler",
    "crates/miedit-installer",
    "crates/miedit-uninstaller",
    "crates/miedit-builder",
]

[workspace.package]
# 版本固定为 0.1.0（用户指令 2026-11-18：自 #13 批次起不再随功能对齐批次递增）
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
