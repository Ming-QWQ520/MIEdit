[package]
name = "miedit-core"
version.workspace = true
edition.workspace = true
description = "MIEdit 核心库：安装包格式、脚本配置、卸载清单与 Windows 工具"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
] }
