[package]
name = "miedit-core"
version.workspace = true
edition.workspace = true
description = "MIEdit 核心库：安装包格式、脚本配置、卸载清单与 Windows 工具"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
brotli = "9"
lzma-rust = { version = "0.1.7", features = ["encoder"] }
walkdir = "2"
serde_json = "1"
toml = "0.8"
bzip2 = "0.6"
mzstd = "0.2"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
] }
